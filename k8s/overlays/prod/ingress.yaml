apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ledger-api
spec:
  ingressClassName: nginx
  rules:
    - host: ledger.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ledger-api
                port:
                  name: http
